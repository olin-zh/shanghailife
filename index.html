<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shanghai Life — 过侬的上海日脚</title>
<meta name="description" content="一款以上海为背景的模拟人生小游戏。挤2号线早高峰、吃生煎、逛武康路、在外滩看夜景、熬过黄梅天——交到真朋友。浏览器里免费玩。">
<meta property="og:title" content="Shanghai Life — 过侬的上海日脚">
<meta property="og:description" content="模拟人生风格的上海生活游戏：挤地铁、吃生煎、逛弄堂、交朋友。浏览器免费玩。">
<meta property="og:url" content="https://shanghailife.app">
<meta property="og:site_name" content="Shanghai Life">
<meta property="og:locale" content="zh_CN">
<meta name="theme-color" content="#0f3b46">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: status strip on top, city board of districts, action sheet below; shikumen stone + Bund teal */
:root{
  --bg:#efe7da; --card:#fbf7f0; --ink:#20272a; --muted:#6c6a63; --line:#d8ccb8;
  --accent:#0f6b73; --brick:#a3412f; --gold:#c08a2b; --good:#3b8a4a; --bad:#b8402f;
  --display:"ZCOOL XiaoWei","Songti SC",serif; --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141a1c; --card:#1d2528; --ink:#ece6da; --muted:#9a9a90; --line:#34403f;
  --accent:#4fb3b5; --brick:#d9735e; --gold:#e0b25a; --good:#6cc27a; --bad:#e2715f; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--body);
  padding:env(safe-area-inset-top,0) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:20px 0 12px;border-bottom:2px solid var(--ink)}
header h1{font-size:clamp(32px,6vw,48px);line-height:1}
header h1 small{display:block;font-family:var(--body);font-size:13px;color:var(--muted);letter-spacing:.08em;margin-top:6px}
.clock{font-variant-numeric:tabular-nums;text-align:right;font-size:13px;color:var(--muted)}
.clock b{display:block;font-size:22px;color:var(--ink);font-family:var(--display);font-weight:400}

/* start */
.start{display:grid;gap:18px;padding:28px 0;max-width:560px}
.start p{margin:0;color:var(--muted)}
.field{display:grid;gap:6px}
.field input{padding:10px 12px;border:1px solid var(--line);background:var(--card);border-radius:6px;font:inherit;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.go{justify-self:start;padding:12px 22px;border:0;border-radius:6px;background:var(--brick);color:#fff;font-weight:700}

/* game */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;padding:14px 0}
.stat{font-size:13px}
.stat .row{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.bar i.low{background:var(--bad)}
.money{font-family:var(--display);font-size:22px}
.main{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start}
@media (max-width:760px){.main{grid-template-columns:1fr}}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:460px){.board{grid-template-columns:repeat(2,1fr)}}
.place{text-align:left;padding:12px;border:1px solid var(--line);background:var(--card);border-radius:4px;min-height:84px;display:grid;align-content:start;gap:2px}
.place b{font-family:var(--display);font-weight:400;font-size:18px}
.place span{font-size:12px;color:var(--muted)}
.place.here{border:2px solid var(--brick);background:color-mix(in srgb,var(--brick) 8%,var(--card))}
.panel{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px;display:grid;gap:12px;min-width:0}
.panel h2{font-size:24px}
.panel .desc{color:var(--muted);font-size:13px;margin:0}
.acts{display:grid;gap:8px}
.act{display:flex;justify-content:space-between;gap:10px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:transparent}
.act:hover:not(:disabled){border-color:var(--accent)}
.act:disabled{opacity:.45;cursor:not-allowed}
.act small{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.friends{display:grid;gap:6px;font-size:13px}
.friend{display:flex;justify-content:space-between;gap:8px}
.log{margin-top:18px;border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px;font-size:14px}
.log p{margin:0}
.log p:first-child{font-weight:500}
.log .t{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:6px}
.foot{margin-top:24px;font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
.foot button{background:none;border:0;text-decoration:underline;color:var(--muted);padding:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;max-width:90vw;font-size:14px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>上海生活<small>SHANGHAI LIFE · 过侬的上海日脚</small></h1>
    <div class="clock" id="clock"></div>
  </header>
  <main id="app"></main>
  <div class="foot"><span>shanghailife.app · 纯属虚构的上海模拟</span><button id="reset" type="button" hidden>重新开始</button></div>
</div>
<div class="toast" id="toast" hidden></div>
<script>
const KEY='shanghailife.v1';
const JOBS={
  coder:{name:'程序员',place:'ljz',pay:420,title:'陆家嘴码农'},
  barista:{name:'咖啡师',place:'wk',pay:220,title:'武康路咖啡师'},
  designer:{name:'设计师',place:'tzf',pay:320,title:'田子坊设计师'}
};
const PLACES={
  home:{name:'石库门亭子间',sub:'黄浦 · 老弄堂',desc:'七平方的亭子间，楼下爷叔天天生煤炉。房租便宜，隔音为零。'},
  metro:{name:'2号线',sub:'换乘 · 早高峰',desc:'人民广场换乘站，早上八点半人贴人。'},
  ljz:{name:'陆家嘴',sub:'浦东 · 写字楼',desc:'三件套底下的写字楼，电梯要排十分钟。'},
  wk:{name:'武康路',sub:'徐汇 · 梧桐区',desc:'梧桐树、老洋房、排队拍照的人和一家家咖啡馆。'},
  tzf:{name:'田子坊',sub:'泰康路 · 创意园',desc:'弄堂改的工作室和小店，游客比住户多。'},
  chp:{name:'城隍庙',sub:'豫园 · 小吃',desc:'南翔小笼、生煎、排骨年糕，排队是常态。'},
  bund:{name:'外滩',sub:'中山东一路',desc:'对岸是陆家嘴的灯，江风很大。'},
  rmgy:{name:'人民公园',sub:'相亲角',desc:'周末满地伞，阿姨们举着简历替小孩找对象。'},
  ykl:{name:'永康路',sub:'酒吧街',desc:'站在路边喝啤酒的地方，十点以后要小声。'}
};
const NPCS={
  ayi:{name:'王阿姨',where:'home',line:'"小鬼头吃过了伐？阿姨帮侬留了碗菜泡饭。"'},
  yeshu:{name:'陈爷叔',where:'chp',line:'"生煎要先咬一小口，汤烫额！"'},
  lily:{name:'Lily',where:'wk',line:'"这家拿铁拉花不错，下次一起来拍照？"'},
  max:{name:'阿迈',where:'ykl',line:'"兄弟，今朝夜里去哪里白相？"'},
  mama:{name:'相亲角李妈妈',where:'rmgy',line:'"侬有房伐？有户口伐？"'}
};
// action: [label, minutes, cost(¥), effects, condition?]
const ACTS={
  home:[
    ['困觉（睡一觉）',480,0,{energy:70,hunger:-25}],
    ['吃王阿姨的菜泡饭',30,0,{hunger:35,social:5},null,'ayi'],
    ['刷手机',60,0,{fun:15,energy:-5}],
    ['外卖点一份炸猪排',40,38,{hunger:45}]
  ],
  metro:[['挤早高峰（去哪里都行）',50,4,{energy:-12,fun:-8}]],
  ljz:[['上班',480,0,{energy:-35,hunger:-25,fun:-15},'work'],['去楼下全家买饭团',15,9,{hunger:20}],['和同事吐槽老板',30,0,{fun:10,social:10}]],
  wk:[['上班（咖啡师）',480,0,{energy:-30,hunger:-20,fun:-5},'work'],['买杯拿铁坐一下午',120,36,{fun:22,energy:8}],['扫街拍梧桐',60,0,{fun:15},null,'lily']],
  tzf:[['上班（设计师）',480,0,{energy:-30,hunger:-20,fun:-8},'work'],['逛小店',60,30,{fun:18}]],
  chp:[['吃生煎和小馄饨',40,28,{hunger:50,fun:5},null,'yeshu'],['排队买南翔小笼',90,45,{hunger:55,fun:-5}]],
  bund:[['江边看夜景',60,0,{fun:25,energy:-5}],['和朋友散步',90,0,{fun:20,social:15},null,'any']],
  rmgy:[['看相亲角的简历',45,0,{fun:12},null,'mama'],['被阿姨盘问家底',30,0,{fun:-10,social:12},null,'mama']],
  ykl:[['路边喝精酿',120,60,{fun:30,energy:-15,social:12},null,'max'],['蹦迪到天亮',300,180,{fun:40,energy:-45,social:20}]]
};
const EVENTS=[
  {when:s=>s.month>=6&&s.month<=7,text:'黄梅天，被子三天没晒干，心情有点潮。',eff:{fun:-6}},
  {when:s=>s.month>=8&&s.month<=9,text:'台风登陆，地铁临时停运一段。',eff:{energy:-6}},
  {when:()=>true,text:'楼下爷叔在弄堂里讲股票，听了半个钟头。',eff:{fun:4}},
  {when:()=>true,text:'共享单车扫到一辆坏的，白走了一站路。',eff:{energy:-4}},
  {when:()=>true,text:'在全家抽中一张免费关东煮券。',eff:{hunger:8}},
  {when:()=>true,text:'房东发微信：下个月房租要涨两百。',eff:{fun:-5}}
];
let S=null;
const $=s=>document.querySelector(s);
const clamp=v=>Math.max(0,Math.min(100,v));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>el.hidden=true,2600)}
function log(t){S.log.unshift([stamp(),t]);S.log=S.log.slice(0,8)}
function stamp(){const h=Math.floor(S.min/60)%24,m=S.min%60;return `第${S.day}天 ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`}

function startScreen(){
  $('#reset').hidden=true;
  let job='coder';
  $('#app').innerHTML=`<section class="start">
    <h2 style="font-size:28px">刚到上海，从一间亭子间开始。</h2>
    <p>赚钞票、交朋友、吃饱困好。熬过黄梅天和早高峰，看看侬能把日子过成啥样子。</p>
    <label class="field">侬叫啥名字<input id="nm" maxlength="12" value="小张"></label>
    <div class="field">做啥工作<div class="chips" id="jobs">${Object.entries(JOBS).map(([k,j])=>`<button type="button" class="chip" data-k="${k}" aria-pressed="${k===job}">${j.title} · 日薪¥${j.pay}</button>`).join('')}</div></div>
    <button class="go" id="go" type="button">开始过日脚</button></section>`;
  $('#jobs').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;job=b.dataset.k;document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===b))};
  $('#go').onclick=()=>{
    S={name:($('#nm').value.trim()||'小张'),job,at:'home',day:1,min:7*60,month:new Date().getMonth()+1,
      money:1500,energy:80,hunger:70,fun:60,social:30,worked:{},friends:{},log:[]};
    log(`${S.name}拖着行李箱住进了石库门亭子间。房租¥2800，楼下有个王阿姨。`);
    save();render();
  };
}
function advance(mins){
  const before=S.day;S.min+=mins;
  while(S.min>=24*60){S.min-=24*60;S.day++}
  const h=mins/60;S.hunger=clamp(S.hunger-h*3);S.energy=clamp(S.energy-h*1.5);
  if(S.day!==before){
    if(S.day%30===1){S.money-=2800;log('交房租¥2800。上海居，大不易。')}
    if(Math.random()<.6){const ev=EVENTS.filter(e=>e.when(S));const e=ev[Math.floor(Math.random()*ev.length)];apply(e.eff);log(e.text)}
  }
}
function apply(eff){for(const k in eff)S[k]=clamp(S[k]+eff[k])}
function mood(){const v=(S.energy+S.hunger+S.fun+S.social)/4;return v>70?'开心':v>45?'还可以':v>25?'有点吃力':'快撑不牢了'}
function travel(p){
  if(p===S.at)return;
  const cost=p==='home'||S.at==='home'?4:3;
  if(S.money<cost){toast('钞票不够买地铁票了');return}
  S.money-=cost;advance(35);S.at=p;log(`坐地铁到${PLACES[p].name}。`);check();save();render();
}
function doAct(i){
  const [label,mins,cost,eff,kind,npc]=ACTS[S.at][i];
  if(S.money<cost){toast('钞票不够');return}
  if(kind==='work'){
    if(JOBS[S.job].place!==S.at){toast(`侬不在这里上班，侬是${JOBS[S.job].title}`);return}
    if(S.worked[S.day]){toast('今天已经上过班了');return}
    if(S.energy<25){toast('太累了，先回去困一觉');return}
    S.worked[S.day]=1;S.money+=JOBS[S.job].pay;log(`上了一天班，赚了¥${JOBS[S.job].pay}。`);
  }
  S.money-=cost;apply(eff);advance(mins);
  if(npc){
    const ids=npc==='any'?Object.keys(S.friends):[npc];
    ids.forEach(id=>{S.friends[id]=Math.min(100,(S.friends[id]||0)+12)});
    if(npc!=='any'){const n=NPCS[npc];log(`${n.name}：${n.line}`);if(S.friends[npc]>=60&&!S['f_'+npc]){S['f_'+npc]=1;toast(`侬和${n.name}成了好朋友！`)}}
  }
  if(kind!=='work')log(`${label}${cost?`，花了¥${cost}`:''}。`);
  check();save();render();
}
function check(){
  if(S.hunger<=0){S.hunger=30;S.money-=200;S.at='home';log('饿昏了头，被送去社区医院挂了水，花了¥200。')}
  if(S.energy<=0){S.energy=40;S.at='home';advance(600);log('累到在地铁上困着，坐过了五站。回家困了一整夜。')}
  if(S.money<-3000){log('欠了一屁股债，只好卷铺盖回老家。游戏结束，可以点下面"重新开始"。')}
}
function bar(label,v){return `<div class="stat"><div class="row"><span>${label}</span><span>${Math.round(v)}</span></div><div class="bar"><i class="${v<25?'low':''}" style="width:${v}%"></i></div></div>`}
function render(){
  $('#reset').hidden=false;
  const h=Math.floor(S.min/60),m=S.min%60;
  $('#clock').innerHTML=`<b>${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}</b>第${S.day}天 · ${S.month}月`;
  const p=PLACES[S.at],acts=ACTS[S.at]||[];
  const fr=Object.entries(S.friends).filter(([,v])=>v>0);
  $('#app').innerHTML=`
  <div class="stats">
    <div class="stat"><div>${S.name} · ${JOBS[S.job].title}</div><div class="money" style="color:${S.money<0?'var(--bad)':'inherit'}">¥${S.money.toLocaleString()}</div><div style="font-size:12px;color:var(--muted)">心情：${mood()}</div></div>
    ${bar('精力',S.energy)}${bar('肚皮',S.hunger)}${bar('开心',S.fun)}${bar('社交',S.social)}
  </div>
  <div class="main">
    <div class="board">${Object.entries(PLACES).map(([k,v])=>`<button type="button" class="place ${k===S.at?'here':''}" data-p="${k}"><b>${v.name}</b><span>${v.sub}</span></button>`).join('')}</div>
    <div class="panel">
      <h2>${p.name}</h2><p class="desc">${p.desc}</p>
      <div class="acts">${acts.map((a,i)=>`<button type="button" class="act" data-i="${i}" ${S.money<a[2]?'disabled':''}><span>${a[0]}</span><small>${a[1]>=60?(a[1]/60).toFixed(a[1]%60?1:0)+'小时':a[1]+'分'}${a[2]?' · ¥'+a[2]:''}</small></button>`).join('')}</div>
      <div><h3 style="font-size:16px">朋友</h3><div class="friends">${fr.length?fr.map(([k,v])=>`<div class="friend"><span>${NPCS[k].name}</span><span style="color:var(--muted)">${v>=60?'好朋友':v>=30?'熟人':'认得'} · ${v}</span></div>`).join(''):'<span style="color:var(--muted)">还没认得人。去城隍庙、武康路或永康路转转。</span>'}</div></div>
    </div>
  </div>
  <div class="log">${S.log.map(([t,x])=>`<p><span class="t">${t}</span>${x}</p>`).join('')}</div>`;
  $('.board').onclick=e=>{const b=e.target.closest('.place');if(b)travel(b.dataset.p)};
  $('.acts').onclick=e=>{const b=e.target.closest('.act');if(b&&!b.disabled)doAct(+b.dataset.i)};
}
$('#reset').onclick=()=>{if($('#reset').dataset.c){try{localStorage.removeItem(KEY)}catch(e){}S=null;$('#reset').textContent='重新开始';delete $('#reset').dataset.c;$('#clock').textContent='';startScreen()}else{$('#reset').dataset.c=1;$('#reset').textContent='再点一次确认重新开始';setTimeout(()=>{$('#reset').textContent='重新开始';delete $('#reset').dataset.c},3000)}};
S=load();S?render():startScreen();
</script>
</body>
</html>
